<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Vollbild PWA</title>
  
  <!-- Verknüpfung zum Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Farben für die Statusleiste auf Mobilgeräten -->
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #1e293b;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Hallo Vollbild-PWA!</h1>
  <p>Wenn du mich installierst, verschwindet die Browser-Leiste.</p>
  
  <!-- Optionaler Button für echtes Vollbild im Browser selbst -->
  <button onclick="toggleFullscreen()">Vollbild umschalten</button>

  <script>
    // 1. Service Worker registrieren (Pflicht für PWA-Installation)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker aktiv'))
        .catch(err => console.error('Fehler:', err));
    }

    // 2. Optional: Echtes Vollbild (inkl. Ausblenden der Handy-Statusleiste)
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log('Vollbild-Fehler:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>

</body>
</html>
